<rect x="475" y="681.5" width="13" height="5.5" rx="1.5" fill="{{MUSTARD}}" stroke="none"/>
<rect x="533" y="660" width="9" height="50" rx="4" fill="{{STEEL_SH}}" stroke-width="{{D}}"/>
</g>
</svg>
