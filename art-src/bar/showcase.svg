<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 604 330 116" data-part="showcase" data-scale="1">
<!--
  Подстоечная холодильная витрина (этап 12.3(2)): блок 60 см под рабочей поверхностью, виден верх фасада (низ обрезан краем кадра). Шкала бара 4,64 px/см: ширина фасада 294 px = 63 см.
  Слои: ниша (тёмный проём), торец столешницы, фасад (панель управления, рама дверцы, задняя стенка, полка), ручка. Еда четырёх наборов — sc-*.svg внутри окна, переднее стекло — showcase-glass.svg поверх.
  Зона food (перенесена): x 250, y 626, w 310, h 94. Свет сверху слева: тень справа. Контур 3,5 / 3 / 2 px.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
