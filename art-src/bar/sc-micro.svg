  Дверца с окном (тарелка с блюдом, тёплый свет) и вертикальной ручкой слева, панель справа: дисплей и шесть кнопок диаметром 12 px (под палец). Зона food общая с холодильной витриной и охватывает обе ниши (x 250–1048).
  Свет сверху слева. Контур 3,5 / 3 / 2 px.
-->
