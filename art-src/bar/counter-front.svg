<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 604 1280 116" data-part="counterFront" data-after="static" data-scale="1">
<!--
  Фасад тумбы под столешницей (этап 12.3(2), исправление 24б): всегда виден, во всю ширину кадра. Тёмный низ, пять дверец; три средние стоят ровно в нишах подстоечных блоков (x 250–560, 572–804, 816–1048): купленный блок закрывает свою дверцу.
  Низ обрезан краем кадра (y 720) на корпусе. Кромка столешницы и тень под ней — counter-nose.svg (рисуется поверх блоков). Свет сверху слева: ручки светлые слева, тень справа. Контур 3,5 / 3 / 2 px.
-->
<g stroke="{{INK}}" stroke-linejoin="round" stroke-linecap="round">
<rect x="-6" y="622" width="1292" height="110" fill="{{CHOC}}" stroke="none"/>
<g stroke-width="{{M}}" fill="{{WOOD_SH}}">
