<rect x="250" y="630" width="310" height="104" rx="5"/>
<rect x="572" y="630" width="232" height="104" rx="5"/>
<rect x="816" y="630" width="232" height="104" rx="5"/>
<rect x="1060" y="630" width="214" height="104" rx="5"/>
</g>
<g fill="{{WOOD}}" stroke="none">
<rect x="9" y="633" width="226" height="6" rx="2"/>
<rect x="253" y="633" width="304" height="6" rx="2"/>
<rect x="575" y="633" width="226" height="6" rx="2"/>
<rect x="819" y="633" width="226" height="6" rx="2"/>
<rect x="1063" y="633" width="208" height="6" rx="2"/>
