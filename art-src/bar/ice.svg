<!--
  Ледогенератор (этап 12.3(1)): компактный аппарат на столешнице, а не ведёрко. Корпус-короб с верхней крышкой (ручка), окно, за которым виден лёд,
  индикатор питания, лоток выдачи со льдом, совок на боковом крючке, ножки, тень. Привязка и зона ice (330,516,124,90) не меняются; подписи «лёд» нет.
  Свет сверху слева (тень справа), «крупные» 3,5 px у корпуса, «средние» 3 у крышки и лотка, «мелкие» 2 у льда и ручек.
-->
